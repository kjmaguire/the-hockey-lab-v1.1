# The Hockey Lab — Cloudflare Workers (Static Assets + /api/nhl/* proxy)
# This is the config Workers Builds reads (build root = the cloudflare/ folder).
# Paths here are relative to THIS folder: main = worker.ts, assets = ./public.

name = "the-hockey-lab"
main = "worker.ts"
compatibility_date = "2025-05-15"

[assets]
directory = "./public"
binding = "ASSETS"
# Unmatched routes 404 so worker.ts can retry them as <path>.html (SPA fallback).
not_found_handling = "none"

# Capture Worker logs (console.* incl. the client error beacon, cron + upstream errors).
[observability]
enabled = true
head_sampling_rate = 1

# Run the Worker at the optimal location (edge for cache hits; nearer NHL for cold fetches).
[placement]
mode = "smart"

# Paid plan: claim the full CPU ceiling so the heavy fan-out compositions (teamStats
# assembles ~24 upstream stat reports) never trip a low CPU cap. Free plan caps at 10ms;
# Workers Paid allows up to 30s of CPU per invocation.
[limits]
cpu_ms = 30000

# --- Durable L2 cache (D1) -------------------------------------------------------
# Table: nhl_cache (k TEXT PRIMARY KEY, body TEXT, exp INTEGER, updated INTEGER)
[[d1_databases]]
binding = "DB"
database_name = "the-hockey-lab-cache"
database_id = "f2455b63-80f9-49bb-8fa3-cb835f00c23d"

# --- Global warm cache + last-known-good (KV) ------------------------------------
[[kv_namespaces]]
binding = "CACHE_KV"
id = "95ae18c75fea43afb8282d9a676268c6"

# --- Rate limiting (soft per-IP limiter + /api/log throttle) ---------------------
# Reuses the same KV namespace; rate-limit keys are prefixed "rl:" so they never
# collide with the cache's "c:" / "f:" keys. No second namespace required.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "95ae18c75fea43afb8282d9a676268c6"

# --- Analytics Engine (cache-tier / latency metrics) -----------------------------
# Query with the DATASET name as the table: SELECT ... FROM nhl_analytics_engine
[[analytics_engine_datasets]]
binding = "nhl_proxy_metrics"
dataset = "nhl_analytics_engine"

# --- Real-time live updates (Durable Object) -------------------------------------
# LiveHub fans out one server-side poll to every connected client over a hibernating
# WebSocket, so the scoreboard + live draft tracker update in ~1s instead of each
# browser polling every 20s. One instance per topic ("scores" / "draft").
[[durable_objects.bindings]]
name = "LIVE_HUB"
class_name = "LiveHub"

[[migrations]]
tag = "v1"
new_classes = ["LiveHub"]

# --- Cron warming ----------------------------------------------------------------
# Pre-fetch the hot endpoints every minute (Workers Paid 1-minute cron). The Worker
# tiers internally: live-critical endpoints (scoreboard, live draft tracker + CS board)
# re-warm every minute; the broader reference set every ~5 min. Write-if-changed keeps
# KV writes minimal.
[triggers]
crons = ["* * * * *"]
