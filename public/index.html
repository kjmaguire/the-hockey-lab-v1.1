<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet"/>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#f5f4f0;color:#15161b;font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#d8d6ce;border-radius:99px}
  table{font-family:inherit;}
  .ed-col{transition:transform .5s cubic-bezier(.16,1,.3,1);}
  @keyframes edp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
  .ed-pulse{animation:edp 1.1s ease-in-out infinite;}
  .ec{transition:border-color .15s, transform .15s, box-shadow .15s;}
  .ec:hover{border-color:#cfccc2!important;transform:translateY(-2px);box-shadow:0 10px 30px -14px rgba(0,0,0,.14);}
  .er:hover{background:#faf9f6;}
  .el:hover{color:#15161b!important;}
  .epr:hover{background:#f3f1ec!important;}
  html[data-theme="dark"] body{background:#141519;color:#ecedf0;}
  html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#3b3d46;}
  html[data-theme="dark"] .ec:hover{border-color:#50525c!important;box-shadow:0 10px 30px -14px rgba(0,0,0,.55)!important;}
  html[data-theme="dark"] .er:hover{background:#23242b;}
  html[data-theme="dark"] .el:hover{color:#ecedf0!important;}
  html[data-theme="dark"] .epr:hover{background:#26272e!important;}
  @keyframes edload{0%{background-position:-40% 0}100%{background-position:140% 0}}
  @keyframes edshim{0%{background-position:-160% 0}100%{background-position:160% 0}}
  .ed-skel{background:linear-gradient(90deg,#e6e4de33 25%,#cfccc255 37%,#e6e4de33 63%);background-size:300% 100%;animation:edshim 1.3s ease-in-out infinite;border-radius:8px;}
  html[data-theme="dark"] .ed-skel{background:linear-gradient(90deg,#2a2c3355 25%,#3b3d4688 37%,#2a2c3355 63%);background-size:300% 100%;}
  .ed-burger{display:none!important;}
  @keyframes news-tick{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  .news-tick-track{display:inline-flex;gap:28px;white-space:nowrap;animation:news-tick 42s linear infinite;will-change:transform;}
  .news-tick:hover .news-tick-track{animation-play-state:paused;}
  @media(prefers-reduced-motion:reduce){.news-tick-track{animation:none;}}
  /* tablet */
  @media(max-width:900px){
    .ed-nav button{font-size:13px!important;padding:6px 9px!important;}
  }
  /* mobile: hamburger replaces inline nav */
  @media(max-width:720px){
    .ed-nav{display:none!important;}
    .ed-spacer{display:none!important;}
    .ed-season{display:none!important;}
    .ed-burger{display:flex!important;}
    .ed-searchlabel,.ed-kbd{display:none!important;}
    main{padding-left:14px!important;padding-right:14px!important;padding-top:20px!important;}
    h1{font-size:30px!important;}
  }
  @media(max-width:480px){
    h1{font-size:26px!important;}
    .ed-demo{display:none!important;}
  }
</style>
