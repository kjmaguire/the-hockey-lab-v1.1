<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#f5f4f0;color:#15161b;font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  /* keyboard focus rings (a11y) — visible for keyboard users, suppressed on mouse click */
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2.5px solid #15161b;outline-offset:2px;border-radius:4px;}
  html[data-theme="dark"] a:focus-visible,html[data-theme="dark"] button:focus-visible,html[data-theme="dark"] input:focus-visible,html[data-theme="dark"] select:focus-visible,html[data-theme="dark"] [tabindex]:focus-visible{outline-color:#ecedf0;}
  /* skip-to-content (a11y) — first tab stop jumps keyboard/screen-reader users past the chrome */
  .skip-link{position:fixed;left:8px;top:-60px;z-index:200;background:#15161b;color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;text-decoration:none;transition:top .15s;}
  .skip-link:focus{top:8px;}
  html[data-theme="dark"] .skip-link{background:#ecedf0;color:#15161b;}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#d8d6ce;border-radius:99px}
  table{font-family:inherit;}
  .ed-col{transition:transform .5s cubic-bezier(.16,1,.3,1);}
  @keyframes edp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
  .ed-pulse{animation:edp 1.1s ease-in-out infinite;}
  .ec{transition:border-color .15s, transform .15s, box-shadow .15s;}
  .ec:hover{border-color:#cfccc2!important;transform:translateY(-2px);box-shadow:0 10px 30px -14px rgba(0,0,0,.14);}
  .er:hover{background:#faf9f6;}
  .el:hover{color:#15161b!important;}
  .epr:hover{background:#f3f1ec!important;}
  html[data-theme="dark"] body{background:#141519;color:#ecedf0;}
  html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#3b3d46;}
  html[data-theme="dark"] .ec:hover{border-color:#50525c!important;box-shadow:0 10px 30px -14px rgba(0,0,0,.55)!important;}
  html[data-theme="dark"] .er:hover{background:#23242b;}
  html[data-theme="dark"] .el:hover{color:#ecedf0!important;}
  html[data-theme="dark"] .epr:hover{background:#26272e!important;}
  @keyframes edload{0%{background-position:-40% 0}100%{background-position:140% 0}}
  @keyframes edshim{0%{background-position:-160% 0}100%{background-position:160% 0}}
  .ed-skel{background:linear-gradient(90deg,#e6e4de33 25%,#cfccc255 37%,#e6e4de33 63%);background-size:300% 100%;animation:edshim 1.3s ease-in-out infinite;border-radius:8px;}
  html[data-theme="dark"] .ed-skel{background:linear-gradient(90deg,#2a2c3355 25%,#3b3d4688 37%,#2a2c3355 63%);background-size:300% 100%;}
  .ed-burger{display:none!important;}
  .ed-tabscroll::-webkit-scrollbar{display:none;}
  /* header nav: priority+ layout fits tabs inline; overflow goes to a More menu, so keep overflow visible for the dropdown */
  .ed-nav{min-width:0;}
  .ed-spacer{display:none!important;}
  @keyframes news-tick{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  .news-tick-track{display:inline-flex;gap:28px;white-space:nowrap;animation:news-tick 42s linear infinite;will-change:transform;}
  .news-tick:hover .news-tick-track{animation-play-state:paused;}
  @media(prefers-reduced-motion:reduce){.news-tick-track{animation:none;}}
  /* full reduced-motion pass (a11y): kill decorative loops + long transitions for users who ask */
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
    .ed-pulse,.ed-skel,.news-tick-track{animation:none!important;}
    .ec:hover{transform:none!important;}
  }
  /* tablets & below: the full hamburger menu replaces the inline nav (cleaner than a cramped scroller for 11 items) */
  @media(max-width:1024px){
    .ed-nav{display:none!important;}
    .ed-burger{display:flex!important;}
    .ed-searchlabel,.ed-kbd{display:none!important;}
  }
  /* phones */
  @media(max-width:640px){
    .ed-season{display:none!important;}
    .ed-demo{display:none!important;}
    main{padding-left:16px!important;padding-right:16px!important;padding-top:20px!important;}
    h1{font-size:28px!important;}
    .g2{grid-template-columns:1fr!important;}
    header button{min-height:42px;min-width:42px;}
  }
  @media(max-width:400px){
    h1{font-size:24px!important;}
  }
</style>
